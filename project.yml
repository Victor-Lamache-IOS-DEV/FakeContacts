name: FakeContacts
options:
  bundleIdPrefix: com.victorlamache
  deploymentTarget:
    iOS: "26.0"
  swiftVersion: "5.9"

targets:
  FakeContacts:
    type: application
    platform: iOS
    sources:
      - FakeContacts
    info:
      path: FakeContacts/Info.plist
      properties:
        CFBundleDisplayName: Contacts
        CFBundleName: Contacts
        UILaunchScreen: {}
        NSContactsUsageDescription: "This app uses your contacts to display them."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorlamache.contactdev
        DEVELOPMENT_TEAM: A63WD37CXZ
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Victor Lamache Dev Profile"
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: MediaPlayer.framework
      - sdk: AudioToolbox.framework
  FakeContactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FakeContactsTests
    dependencies:
      - target: FakeContacts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.9"
